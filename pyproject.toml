[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baobab-lang"
version = "0.8.0"
description = "Baobab : un langage de programmation en français, propulsé par Python"
requires-python = ">=3.8"

[project.scripts]
baobab = "baobab.cli:principal"

[tool.setuptools]
packages = ["baobab", "baobab.bibliotheque"]
